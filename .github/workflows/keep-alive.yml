# Keeps the ZOX backend (Render free plan) awake: Render puts a free service to sleep after 15
# minutes without visits, and waking takes about a minute (D-044). Public repository: Actions minutes
# are free. Only calls the public health check, no secrets.
name: keep-alive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /v1/health
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://zox-backend.onrender.com/v1/health || true)
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
